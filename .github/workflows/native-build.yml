name: Native packages and real platform checks

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native build target
        type: choice
        default: all
        options: [all, windows, ios]
      focused:
        description: Recheck changed native import flow when the Python core is unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  windows:
    if: ${{ github.event.repository.private == false && (inputs.platform == 'all' || inputs.platform == 'windows') }}
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install pinned native dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-desktop.txt
      - name: Verify the runner's existing Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (!$compiler -and !(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') -and !(Test-Path 'C:\Program Files\Inno Setup 6\ISCC.exe')) { throw 'The standard runner lacks its documented Inno Setup compiler' }
      - name: Independent Python tax checks
        if: ${{ !inputs.focused }}
        run: python -m unittest discover -s tests -v
      - name: Build actual Windows executable and installer; frozen smoke
        run: python scripts/build_desktop.py --output-dir dist/windows --work-dir build/windows
      - name: Assert installer and ten real packaged checks
        shell: pwsh
        run: |
          $m = Get-Content dist/windows/build-manifest-win32-x64.json -Raw | ConvertFrom-Json
          $s = Get-Content dist/windows/frozen-smoke-win32-x64.json -Raw | ConvertFrom-Json
          if (!$m.windows_installer_built -or !$s.frozen -or !$s.all_passed -or $s.passed -lt 10) { throw 'Native installer/frozen checks incomplete' }
          python -m pip freeze | Set-Content dist/windows/native-dependency-versions.txt
      - name: Install actual Setup package and check the installed executable
        shell: pwsh
        run: |
          $out = "$PWD/dist/windows"
          $setup = Get-ChildItem "$out/*-Windows-x64-Setup.exe"
          if (@($setup).Count -ne 1) { throw 'Exactly one Windows installer is required' }
          $installedDir = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview'
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="' + $installedDir + '" /LOG="' + $out + '\installer-log.txt"'
          $installation = Start-Process -FilePath $setup.FullName -ArgumentList $arguments -PassThru -Wait
          if ($installation.ExitCode -ne 0) { throw 'Setup installation failed' }
          $installedExe = Join-Path $installedDir 'Tax Reborn.exe'
          if (!(Test-Path $installedExe)) { throw 'Setup did not install the application executable' }
          $sourceHash = (Get-FileHash "$out/Tax Reborn/Tax Reborn.exe" -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash $installedExe -Algorithm SHA256).Hash
          if ($sourceHash -ne $installedHash) { throw 'Installed executable differs from the tested build' }
          $smokeArguments = '--smoke-test --smoke-report "' + $out + '/installed-frozen-smoke-win32-x64.json"'
          $installedSmoke = Start-Process -FilePath $installedExe -ArgumentList $smokeArguments -Wait -PassThru
          if ($installedSmoke.ExitCode -ne 0) { throw 'Installed application smoke failed' }
          $smokeReceipt = Get-Content "$out/installed-frozen-smoke-win32-x64.json" -Raw | ConvertFrom-Json
          if (!$smokeReceipt.frozen -or !$smokeReceipt.all_passed -or $smokeReceipt.passed -lt 15) { throw 'Installed application verification is incomplete' }
          @{ setup_installed=$true; setup_exit_code=$installation.ExitCode; installed_executable_sha256=$installedHash; installed_executable_matches_build=$true; synthetic_only=$true } | ConvertTo-Json | Set-Content "$out/windows-installer-receipt.json"
      - name: Exercise TaxML using the actual installed WebAssembly and JS assets
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          node scripts/test_taxml_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed TaxML runtime checks failed' }
          Copy-Item "$env:TAX_REBORN_RUNTIME_ROOT/qa/taxml/runtime-receipt.json" 'dist/windows/installed-taxml-pyodide-receipt.json'
      - name: Exercise high-income NIIT and AMT using the installed worker assets
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_capital_niit_amt_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed high-income worker checks failed' }
      - name: Exercise binary income and recursive source edits using installed assets
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_binary_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed binary tax-data workflow failed' }
      - name: Exercise complete ValueForm using the actual installed worker
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_derived_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed complete ValueForm runtime checks failed' }
      - name: Exercise automatic arrays using the actual installed worker
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_auto_array_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed automatic array and full source runtime checks failed' }
      - name: Exercise saved value bodies using the actual installed worker
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_typed_value_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed typed value body and complete source runtime checks failed' }
      - name: Exercise whole-number source bounds using the actual installed worker
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_whole_number_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed whole-number source bounds and complete export checks failed' }
      - name: Exercise Entity and FormSet saved objects using the installed worker
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_persistent_document_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed complete Entity/FormSet source workflow failed' }
      - name: Exercise complete stored instance-map sources using installed assets
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_instance_map_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed stored instance-map source workflow failed' }
          python scripts/verify_instance_map_native.py dist/windows/instance-map-corrected.taxbin --output dist/windows/installed-instance-map-readback.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed stored instance-map full document readback failed' }
      - name: Exercise Entity stored map versions using installed assets
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_entity_instance_map_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed Entity map source workflow failed' }
          foreach ($version in @(1,2,3)) {
            python scripts/verify_entity_instance_map_native.py "dist/windows/entity-instance-map-v$version-corrected.taxbin" --version $version --output "dist/windows/installed-Entity-map-v$version-readback.json"
            if ($LASTEXITCODE -ne 0) { throw 'Installed Entity map complete source readback failed' }
          }
      - name: Exercise complete stored-cell corrections using the installed worker
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_source_stored_cell_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed stored-cell actual Worker checks failed' }
          python scripts/verify_source_stored_cell_native.py dist/windows/source-stored-cell-element1-corrected.taxbin --element 1 --value 1234.57 --output dist/windows/installed-source-stored-cell-1-readback.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed stored-cell1 independent complete readback failed' }
          python scripts/verify_source_stored_cell_native.py dist/windows/source-stored-cell-element3-corrected.taxbin --element 3 --value 12.34 --output dist/windows/installed-source-stored-cell-3-readback.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed stored Used-zero cell3 independent complete readback failed' }
      - name: Exercise complete cleartext containers using the installed worker
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_cleartext_container_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed complete cleartext container workflow failed' }
      - name: Exercise Mac monetary TaxML using the actual installed worker
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_mac_taxml_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed Mac monetary TaxML workflow failed' }
      - name: Exercise date source edits using installed JS and WebAssembly
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_mac_date_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed date source workflow failed' }
          foreach ($index in @(0,4,8)) {
            $value = @{'0'='02/29/2000';'4'='12-31';'8'='2025-12'}[[string]$index]
            python scripts/verify_mac_date_native.py "dist/windows/mac-date-$index-corrected.zip" --index $index --value $value
            if ($LASTEXITCODE -ne 0) { throw 'Installed date source whole ZIP readback failed' }
          }
      - name: Load the installed source-interest reader and reject owned invalid resources
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_raw_interest_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed source-interest reader failed module loading or resource identity checks' }
      - name: Exercise payment vouchers using the installed worker and read back actual PDFs
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_payment_voucher_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed payment-voucher worker checks failed' }
          python scripts/verify_payment_voucher_runtime.py dist/windows
          if ($LASTEXITCODE -ne 0) { throw 'Actual installed payment-voucher PDF readback failed' }
      - name: Exercise foreign mailing addresses using the installed worker and PDF readback
        shell: pwsh
        run: |
          $env:TAX_REBORN_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'TaxRebornInstalledPreview/_internal'
          $env:TAX_REBORN_QA_ROOT = "$PWD/dist/windows"
          node scripts/test_foreign_address_runtime.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed foreign-address worker failed' }
          python scripts/verify_foreign_address_runtime.py dist/windows
          if ($LASTEXITCODE -ne 0) { throw 'Installed foreign-address PDF readback failed' }
      - name: Run actual installed native GUI, calculation, edit, save and relaunch
        shell: pwsh
        run: |
          $options=@{}
          if ('${{ inputs.focused }}' -eq 'true') { $options.MixedOnly=$true }
          ./scripts/windows_gui_smoke.ps1 -EffectiveRegistry -CompleteValueForm -AutomaticArrays -TypedValues -WholeNumbers -PersistentObjects -InstanceMaps -CleartextContainer -MacTaxML -MacScalar -MacDate -SourceComparison @options -Executable "$env:RUNNER_TEMP/TaxRebornInstalledPreview/Tax Reborn.exe" -OutputDir "$PWD/dist/windows" -DataDir "$env:RUNNER_TEMP/TaxRebornSyntheticGUI"
      - name: Upload real packages and verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Tax-Reborn-Windows-native
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*.json
            dist/windows/*.png
            dist/windows/*.txt
            dist/windows/*.pdf
            dist/windows/*.xml
            dist/windows/*.taxbin
          if-no-files-found: error
          retention-days: 30

  ios:
    if: ${{ github.event.repository.private == false && (inputs.platform == 'all' || inputs.platform == 'ios') }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify existing Xcode and SDKs; no download or terms acceptance
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-path
          xcrun simctl list runtimes
      - name: Build native Simulator and unsigned device apps; exercise actual WebView
        run: python scripts/build_ios.py --output-dir dist/ios --work-dir build/ios --run-ui-tests
      - name: Check actual build and simulator receipt
        run: |
          python -c 'import json; m=json.load(open("dist/ios/build-manifest-ios.json")); assert m["simulator_built"] and m["simulator_gui_tested"] and m["device_built"]; assert not m["device_signed"] and not m["real_device_tested"]'
      - name: Upload real apps and simulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Tax-Reborn-iOS-native
          path: |
            dist/ios/*.zip
            dist/ios/*.json
            dist/ios/*.png
            dist/ios/*.xcresult
            dist/ios/ios-test-attachments/
          if-no-files-found: error
          retention-days: 30
